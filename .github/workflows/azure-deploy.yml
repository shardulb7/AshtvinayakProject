name: 🚀 Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 📦 Restore dependencies
        run: dotnet restore AshtavinayakApp/AshtavinayakAPP.csproj

      - name: 🏗️ Build & Publish
        run: dotnet publish AshtavinayakApp/AshtavinayakAPP.csproj -c Release -o ./publish

      - name: 📦 Create Linux-compatible zip
        run: |
          cd ./publish
          zip -r ../app.zip . 
          cd ..
          echo "Zip size: $(du -sh app.zip | cut -f1)"

      - name: 🌐 Deploy via Kudu Zip Deploy (curl)
        run: |
          # Get publish credentials from publish profile secret
          PUBLISH_PROFILE="${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}"
          SCM_USER=$(echo "$PUBLISH_PROFILE" | grep -oP 'userName="\K[^"]+' | head -1)
          SCM_PASS=$(echo "$PUBLISH_PROFILE" | grep -oP 'userPWD="\K[^"]+' | head -1)
          APP_NAME="${{ secrets.AZURE_APP_NAME }}"
          
          echo "Deploying $APP_NAME via Kudu zipdeploy..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -u "${SCM_USER}:${SCM_PASS}" \
            --data-binary @app.zip \
            -H "Content-Type: application/zip" \
            --max-time 600 \
            "https://${APP_NAME}.scm.azurewebsites.net/api/zipdeploy")
          
          echo "Deploy HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ]; then
            echo "✅ Deployment succeeded!"
          else
            echo "❌ Deployment failed with HTTP $HTTP_CODE"
            exit 1
          fi
